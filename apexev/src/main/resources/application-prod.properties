# ==========================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ==========================================
# File nay duoc su dung khi chay voi profile: -Dspring.profiles.active=prod

# ==========================================
# 1. DATABASE - AWS RDS
# ==========================================
# Fargate se truyen gia tri that vao cac bien ${...} nay
# DB_URL = jdbc:mysql://[ENDPOINT_RDS]:3306/apexev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# ENDPOINT_RDS = endpoint cua RDS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. JPA/HIBERNATE (QUAN TRONG: TU TAO BANG)
# ==========================================
# SUA TU 'validate' THANH 'update' DE RDS TU TAO BANG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# 3. JWT CONFIGURATION
# ==========================================
com.apexev.jwtSecret=${JWT_SECRET}
com.apexev.jwtExpirationMs=${JWT_EXPIRATION_MS}
com.apexev.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS}

# ==========================================
# 4. SERVER & LOGGING
# ==========================================
server.port=${SERVER_PORT:8080}
logging.level.org.springframework.security=INFO

# ==========================================
# 5. MAIL (Neu dung)
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ==========================================
# 6. AWS S3 CONFIGURATION
# ==========================================
# CRITICAL: Ten bien PHAI khop voi AWS ECS Environment Variables
# AWS ECS dang dung: AWS_S3_BUCKET (khong phai AWS_S3_BUCKET_NAME)
aws.s3.bucket-name=${AWS_S3_BUCKET:apexev-media}
aws.s3.region=${AWS_REGION:ap-southeast-1}
# Dat thanh true de dung Public URL (khong can presigned URL)
aws.s3.use-public-url=true
